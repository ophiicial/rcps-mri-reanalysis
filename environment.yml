name: rcps-mri-reanalysis
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - pyyaml
  - pytest
  - nibabel   # NIfTI/MGZ I/O for imaging QC and ROI extraction
  - pyright   # static analysis / LSP only; never imported by analysis code
  - ruff      # lint only (no formatter); never imported by analysis code
